name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Run test suite
        run: ./tests/Run-Tests.ps1
      - name: Build the lab report end to end
        run: ./Invoke-ADSecurityAudit.ps1 -Lab -OutputDirectory ./out
